# Thin caller — @claude mention handling lives in the org .github repo.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Serialize per issue/PR so two @claude requests can't race a push to the
# same branch; queued requests wait (no cancel-in-progress).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

permissions: {}

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    uses: LEA-Product-and-Engineering/.github/.github/workflows/claude-mention.yml@main
    secrets:
      review_app_id: ${{ secrets.LEA_REVIEW_APP_ID }}
      review_app_private_key: ${{ secrets.LEA_REVIEW_APP_PRIVATE_KEY }}
